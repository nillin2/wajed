<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="site.title">وجد | مطبخ إيطالي أمريكي</title>
  <meta name="description" content="معرض صور مطبخ وجد: أطباق، أجواء، وتفاصيل من المطبخ الإيطالي الأمريكي.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="siteHeader"></header>

  <main id="siteMain">
    <section class="page-hero">
      <div class="container">
        <span class="section-eyebrow" data-i18n="gallery.title">معرض الصور</span>
        <h1 class="section-title" data-i18n="gallery.title">معرض الصور</h1>
        <p class="section-sub" data-i18n="gallery.subtitle">لمحات من مطبقنا، عرباتنا، وأجواء المطبخ.</p>
      </div>
    </section>

    <section class="section-tight">
      <div class="container">
        <div class="gallery-grid">
          <figure class="gallery-item"><img src="images/art/hero-scene.jpg" alt="أطباق إيطالية أمريكية على طاولة دافئة" width="900" height="608" loading="lazy" decoding="async"><figcaption class="gallery-caption">نكهتان من عالمين</figcaption></figure>
          <figure class="gallery-item"><img src="images/art/burger-torino.jpg" alt="برغر توريتو الإيطالي بطبقات اللحم والجبن" width="900" height="608" loading="lazy" decoding="async"><figcaption class="gallery-caption">برغر توريتو</figcaption></figure>
          <figure class="gallery-item"><img src="images/art/pizza-margherita.jpg" alt="بيتزا مارغريتا نابولية بقشرة محمصة" width="900" height="608" loading="lazy" decoding="async"><figcaption class="gallery-caption">بيتزا مارغريتا</figcaption></figure>
          <figure class="gallery-item"><img src="images/art/pasta-bolognese.jpg" alt="بولونيز باللحم الإيطالي" width="900" height="608" loading="lazy" decoding="async"><figcaption class="gallery-caption">بولونيز إيطالي</figcaption></figure>
          <figure class="gallery-item"><img src="images/art/dessert-tiramisu.jpg" alt="تيراميسو إيطالي بالقهوة والكاكاو" width="900" height="608" loading="lazy" decoding="async"><figcaption class="gallery-caption">تارتا إيطالية</figcaption></figure>
          <figure class="gallery-item"><img src="images/art/drink-affogato.jpg" alt="أفوغاتو بالآيس كريم مع الإسبريسو" width="900" height="608" loading="lazy" decoding="async"><figcaption class="gallery-caption">أفوغاتو</figcaption></figure>
          <figure class="gallery-item"><img src="images/art/interior-modern.jpg" alt="أجواء المطعم العصري بإضاءة دافئة" width="900" height="608" loading="lazy" decoding="async"><figcaption class="gallery-caption">أجواء المطعم</figcaption></figure>
          <figure class="gallery-item"><img src="images/art/table-elegant.jpg" alt="طاولة أنيقة مجهزة للتجمعات" width="900" height="608" loading="lazy" decoding="async"><figcaption class="gallery-caption">طاولة أنيقة</figcaption></figure>
          <figure class="gallery-item"><img src="images/art/ingredients-closeup.jpg" alt="مكونات طازجة من الطماطم والريحان والموزاريلا" width="900" height="608" loading="lazy" decoding="async"><figcaption class="gallery-caption">مكونات طازجة</figcaption></figure>
        </div>
      </div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
